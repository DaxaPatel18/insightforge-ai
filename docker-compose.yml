version: '3.8'

services:
  # ============================================================================
  # 1. PostgreSQL Relational Database Service (v16)
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: insightforge_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-insightforge_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be configured in environment or .env}
      POSTGRES_DB: ${POSTGRES_DB:-insightforge_db}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Secure database exposure: By default, Postgres is strictly isolated within the internal
    # network and NOT exposed to external host interfaces (0.0.0.0). Bound to localhost (127.0.0.1)
    # for local administration and maintenance only.
    ports:
      - "127.0.0.1:${POSTGRES_EXTERNAL_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-insightforge_admin} -d ${POSTGRES_DB:-insightforge_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - insightforge_internal

  # ============================================================================
  # 2. FastAPI Backend Service (Stateless, Replicable across nodes)
  # ============================================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: insightforge-backend:latest
    # Note: container_name is intentionally omitted to enable horizontal scaling (--scale backend=N)
    # without container name collisions.
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-insightforge_admin}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be configured in environment or .env}@postgres:5432/${POSTGRES_DB:-insightforge_db}
      INSIGHTFORGE_SECRET_KEY: ${INSIGHTFORGE_SECRET_KEY:?INSIGHTFORGE_SECRET_KEY must be configured as a secure 32+ character key}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-20}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-30}
      DB_POOL_RECYCLE: ${DB_POOL_RECYCLE:-1800}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-30}
      # Tuned to 1 worker by default for embedded SQLite-backed ChromaDB concurrency safety.
      # Scale to 4+ workers or multiple container replicas when external ChromaDB (CHROMA_SERVER_HOST) is used.
      WORKERS: ${BACKEND_WORKERS:-1}
      CHROMA_PERSIST_DIR: ${CHROMA_PERSIST_DIR:-/app/chroma_db}
      CHROMA_SERVER_HOST: ${CHROMA_SERVER_HOST:-}
      CHROMA_SERVER_PORT: ${CHROMA_SERVER_PORT:-8000}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - shared_uploads:/app/uploads
      - shared_chroma:/app/chroma_db
      - shared_data:/app/data
    expose:
      - "8000"
    # Bound to localhost (127.0.0.1) for local host API access/debugging.
    # Note: If scaling multiple backend replicas (--scale backend=N), omit or dynamically assign host
    # ports to avoid host port allocation conflicts. Nginx handles ingress load-balancing on port 80.
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - insightforge_internal
      - insightforge_public

  # ============================================================================
  # 3. Nginx Web Server & Frontend SPA Gateway
  # ============================================================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: insightforge-frontend:latest
    container_name: insightforge_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 3s
      retries: 3
    networks:
      - insightforge_public

# ==============================================================================
# Persistent Named Volumes
# ==============================================================================
volumes:
  postgres_data:
    driver: local
  shared_uploads:
    driver: local
  shared_chroma:
    driver: local
  shared_data:
    driver: local

# ==============================================================================
# Network Segmentation
# ==============================================================================
networks:
  insightforge_internal:
    driver: bridge
    internal: true
  insightforge_public:
    driver: bridge
